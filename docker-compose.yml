services:
  composer-api:
    build: .
    image: g5kc/composer-api:latest
    container_name: composer-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_SDK_BRIDGE_PORT: "8792"
      CURSOR_SDK_BRIDGE_TIMEOUT_MS: "180000"
